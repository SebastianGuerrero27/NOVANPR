services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: anpr-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SecurePassword123!
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    volumes:
      - db_data:/var/opt/mssql
      - ./db:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "SecurePassword123!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1.6.0
    container_name: anpr-mediamtx
    ports:
      - "8554:8554"      # RTSP
      - "1935:1935"      # RTMP
      - "8888:8888"      # HLS
      - "8889:8889"      # WebRTC HTTP
      - "8189:8189/udp"  # WebRTC ICE/UDP
      - "9997:9997"      # API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    restart: always

  backend:
    build: ./backend
    container_name: anpr-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DB_USER=sa
      - DB_PASSWORD=SecurePassword123!
      - DB_SERVER=db
      - DB_PORT=1433
      - DB_NAME=ANPR_ECU911
      - JWT_SECRET=ecu911_super_secret_token_key_2026
      - MEDIA_DIR=/app/media
      - ANPR_SERVICE_URL=http://anpr:8000
      - DOCKER_CONTAINER=true
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./db:/app/db:ro
      - ./services/anpr/media:/app/media
      - ./services/anpr/media:/app/services/anpr/media
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: anpr-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

  anpr:
    build: ./services/anpr
    container_name: anpr-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BACKEND_URL=http://backend:5000
      - BACKEND_SOCKETIO_URL=http://backend:5000
      - OCR_ENGINE=easyocr
      - MEDIA_DIR=/app/media
      - CAMERA_SOURCE=rtsp
      - RTSP_URL=rtsp://mediamtx:8554/camara_raw
      - RTSP_STREAM_URL=rtsp://mediamtx:8554/camara_raw
      - RUNNING_IN_DOCKER=true
      - DEBUG_VISUAL=true
      - DEBUG_SHOW_WINDOW=false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/anpr:/app
      - ./services/anpr/media:/app/media
    depends_on:
      - mediamtx
      - backend
    restart: always

volumes:
  db_data:
