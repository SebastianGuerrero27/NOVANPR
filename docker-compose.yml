services:
  db:
    image: postgres:17-alpine
    container_name: anpr-db
    environment:
      - POSTGRES_DB=ANPR_ECU911
      - POSTGRES_USER=${DB_USER:-anpr}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      # Solo en el equipo anfitrión (herramientas de administración); la aplicación usa la red de Docker
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 10s
      retries: 10
    # PostgreSQL mantiene un límite de memoria pequeño para dejar recursos al motor ANPR.
    deploy:
      resources:
        limits:
          memory: 768m

  redis:
    image: redis:7-alpine
    container_name: anpr-redis
    ports:
      # Solo en el equipo anfitrión: Redis no tiene contraseña y no debe exponerse a la red
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m

  prometheus:
    image: prom/prometheus:latest
    container_name: anpr-prometheus
    ports:
      # Prometheus no tiene autenticación: solo en el equipo anfitrión
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    depends_on:
      - backend
      - anpr

  grafana:
    image: grafana/grafana:latest
    container_name: anpr-grafana
    ports:
      # Tableros de administración: solo en el equipo anfitrión (para otros equipos, publicarlo
      # tras un proxy con HTTPS)
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD en .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    depends_on:
      - prometheus

  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    container_name: anpr-mediamtx
    environment:
      # IP del equipo (host) que el navegador usa para WebRTC; agregar la IP de la LAN para
      # ver el video desde otros equipos, p. ej. WEBRTC_HOSTS=127.0.0.1,<IP de este equipo en la LAN>
      - MTX_WEBRTCADDITIONALHOSTS=${WEBRTC_HOSTS:-127.0.0.1}
    ports:
      # RTSP: lo lee el motor dentro de la red de Docker; en el anfitrión solo para diagnóstico local
      - "127.0.0.1:8554:8554"
      # WebRTC: lo usan los navegadores de los operadores en la red local (lectura con ticket del backend)
      - "8889:8889"      # señalización WHEP
      - "8189:8189/udp"  # medios
      - "8189:8189/tcp"  # respaldo TCP
      # La API (9997) no se publica: solo la usa el backend dentro de la red de Docker
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: always
    # La imagen no trae shell ni utilidades para un healthcheck; el backend sincroniza las rutas de
    # las cámaras por su API cada minuto (las vuelve a crear si MediaMTX se reinicia)
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    build: ./backend
    container_name: anpr-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DB_USER=${DB_USER:-anpr}
      - DB_PASSWORD=${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      - DB_SERVER=db
      - DB_PORT=5432
      - DB_NAME=ANPR_ECU911
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en .env}
      # Clave AES-256 de las contraseñas RTSP (openssl rand -base64 32); sin ella se deriva de JWT_SECRET.
      # Al cambiarla, la anterior va en CAMARAS_CLAVE_CIFRADO_ANTERIOR: al arrancar se recifra todo
      - CAMARAS_CLAVE_CIFRADO=${CAMARAS_CLAVE_CIFRADO:-}
      - CAMARAS_CLAVE_CIFRADO_ANTERIOR=${CAMARAS_CLAVE_CIFRADO_ANTERIOR:-}
      # Redes donde pueden estar las cámaras (CIDR separados por coma; protección contra SSRF).
      # Vacío = redes privadas; en producción, la VLAN de cámaras (p. ej. 10.20.30.0/24)
      - CAMARAS_REDES_PERMITIDAS=${CAMARAS_REDES_PERMITIDAS:-}
      # Proxy inverso delante del backend: número de saltos (p. ej. 1). Vacío = conexión directa
      - TRUST_PROXY=${TRUST_PROXY:-}
      - LIMITE_API_POR_MINUTO=${LIMITE_API_POR_MINUTO:-600}
      - LIMITE_ACCESO_POR_15_MIN=${LIMITE_ACCESO_POR_15_MIN:-20}
      - ANPR_SERVICE_TOKEN=${ANPR_SERVICE_TOKEN:?Defina ANPR_SERVICE_TOKEN en .env}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-ecu911.gob.ec}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MEDIA_DIR=/app/media
      - ANPR_SERVICE_URL=http://anpr:8000
      - ANPR_PUBLIC_URL=${ANPR_PUBLIC_URL:-http://localhost:8000}
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554
      - WEBRTC_PUBLIC_URL=${WEBRTC_PUBLIC_URL:-http://localhost:8889}
      - DOCKER_CONTAINER=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      # Centro de notificaciones: Socket.IO con adaptador Redis (varias instancias) y Web Push
      - SOCKET_REDIS_ADAPTER=true
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:anpr@ecu911.gob.ec}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./db:/app/db:ro
      - ./services/anpr/media:/app/media
      - ./services/anpr/media:/app/services/anpr/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      # Listo = API arriba y PostgreSQL respondiendo (Redis se informa, pero no lo bloquea)
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 768m

  frontend:
    build: ./frontend
    container_name: anpr-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768m

  anpr:
    build: ./services/anpr
    container_name: anpr-service
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://backend:5000
      - ANPR_SERVICE_TOKEN=${ANPR_SERVICE_TOKEN:?Defina ANPR_SERVICE_TOKEN en .env}
      - OCR_ENGINE=plate
      # Revalidación de caracteres con el segundo OCR; no dibuja overlays en el flujo de video.
      - OCR_VERIFIER_ENABLED=true
      - MEDIA_DIR=/app/media
      # Sin fuente inicial: el backend asigna la cámara registrada (su ruta en MediaMTX) al arrancar
      - RTSP_URL=
      - RUNNING_IN_DOCKER=true
      - DEBUG_VISUAL=true
      - DEBUG_SHOW_WINDOW=false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/anpr:/app
      - ./services/anpr/media:/app/media
      # Caché de pesos descargados (CLIP, PP-OCRv6, fast-plate-ocr): evita volver a bajarlos al recrear
      - anpr_model_cache:/root/.cache
    depends_on:
      mediamtx:
        condition: service_started
      # El motor pide su cámara al backend al arrancar: espera a que la API y la base estén listas
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/status', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      # Carga del detector y del OCR
      start_period: 180s
    # Sin límite de CPU: la inferencia (YOLO + OCR) usa todos los núcleos disponibles. La memoria
    # tiene tope con holgura (≈1,4 GiB medidos con los modelos cargados)
    deploy:
      resources:
        limits:
          memory: 6g

volumes:
  anpr_model_cache:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
