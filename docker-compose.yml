services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: anpr-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env}
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    volumes:
      - db_data:/var/opt/mssql
      - ./db:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: anpr-redis
    ports:
      # Solo en el equipo anfitrión: Redis no tiene contraseña y no debe exponerse a la red
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: anpr-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    restart: always
    depends_on:
      - backend
      - anpr

  grafana:
    image: grafana/grafana:latest
    container_name: anpr-grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD en .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=
    restart: always
    depends_on:
      - prometheus

  mediamtx:
    image: bluenviron/mediamtx:1.6.0
    container_name: anpr-mediamtx
    environment:
      # IP del equipo (host) que el navegador usa para WebRTC; agregar la IP de la LAN para
      # ver el video desde otros equipos, p. ej. WEBRTC_HOSTS=127.0.0.1,192.168.0.105
      - MTX_WEBRTCADDITIONALHOSTS=${WEBRTC_HOSTS:-127.0.0.1}
    ports:
      - "8554:8554"      # RTSP (lectura autenticada)
      - "8889:8889"      # WebRTC (señalización WHEP)
      - "8189:8189/udp"  # WebRTC (medios)
      - "8189:8189/tcp"  # WebRTC (respaldo TCP)
      # La API (9997) no se publica: solo la usa el backend dentro de la red de Docker
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: always

  backend:
    build: ./backend
    container_name: anpr-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DB_USER=sa
      - DB_PASSWORD=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD en .env}
      - DB_SERVER=db
      - DB_PORT=1433
      - DB_NAME=ANPR_ECU911
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET en .env}
      - ANPR_SERVICE_TOKEN=${ANPR_SERVICE_TOKEN:?Defina ANPR_SERVICE_TOKEN en .env}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-ecu911.gob.ec}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - MEDIA_DIR=/app/media
      - ANPR_SERVICE_URL=http://anpr:8000
      - ANPR_PUBLIC_URL=${ANPR_PUBLIC_URL:-http://localhost:8000}
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554
      - WEBRTC_PUBLIC_URL=${WEBRTC_PUBLIC_URL:-http://localhost:8889}
      - DOCKER_CONTAINER=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - CACHE_TTL_SECONDS=3600
      # Centro de notificaciones: Socket.IO con adaptador Redis (varias instancias) y Web Push
      - SOCKET_REDIS_ADAPTER=true
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:anpr@ecu911.gob.ec}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./db:/app/db:ro
      - ./services/anpr/media:/app/media
      - ./services/anpr/media:/app/services/anpr/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: anpr-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

  anpr:
    build: ./services/anpr
    container_name: anpr-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BACKEND_URL=http://backend:5000
      - BACKEND_SOCKETIO_URL=http://backend:5000
      - ANPR_SERVICE_TOKEN=${ANPR_SERVICE_TOKEN:?Defina ANPR_SERVICE_TOKEN en .env}
      - OCR_ENGINE=plate
      - MEDIA_DIR=/app/media
      - CAMERA_SOURCE=rtsp
      # Fuente inicial vacía: el backend asigna la cámara (vía MediaMTX) al arrancar
      - RTSP_URL=
      - RTSP_STREAM_URL=
      - RUNNING_IN_DOCKER=true
      - DEBUG_VISUAL=true
      - DEBUG_SHOW_WINDOW=false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/anpr:/app
      - ./services/anpr/media:/app/media
      # Caché de pesos descargados (CLIP, PP-OCRv6, fast-plate-ocr): evita volver a bajarlos al recrear
      - anpr_model_cache:/root/.cache
    depends_on:
      - mediamtx
      - backend
    restart: always

volumes:
  anpr_model_cache:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
