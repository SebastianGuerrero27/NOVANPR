[pytest]
# Pruebas del motor ANPR. `archive/` guarda pruebas de un pipeline retirado (no importable):
# se excluye de la recolección. `pythonpath = .` permite `import app...` desde cualquier ruta.
testpaths = tests
norecursedirs = archive .* __pycache__ build dist venv .venv node_modules
pythonpath = .
