name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.anpr.ecu911.gob.ec
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/staging/
          kubectl rollout status deployment/anpr-backend -n staging
          kubectl rollout status deployment/anpr-frontend -n staging
          kubectl rollout status deployment/anpr-service -n staging

      - name: Run database migrations
        run: |
          kubectl exec -n staging deployment/anpr-backend -- npm run migrate

      - name: Verify deployment
        run: |
          kubectl get pods -n staging
          kubectl get services -n staging

      - name: Run smoke tests
        run: |
          curl -f https://staging.anpr.ecu911.gob.ec/health || exit 1
          curl -f https://staging.anpr.ecu911.gob.ec/api/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://anpr.ecu911.gob.ec
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Create backup
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          kubectl exec -n production deployment/anpr-db -- pg_dump ANPR_ECU911 > backup_${TIMESTAMP}.sql
          # Upload backup to S3 or similar storage

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/production/
          kubectl rollout status deployment/anpr-backend -n production
          kubectl rollout status deployment/anpr-frontend -n production
          kubectl rollout status deployment/anpr-service -n production

      - name: Run database migrations
        run: |
          kubectl exec -n production deployment/anpr-backend -- npm run migrate

      - name: Verify deployment
        run: |
          kubectl get pods -n production
          kubectl get services -n production

      - name: Run smoke tests
        run: |
          curl -f https://anpr.ecu911.gob.ec/health || exit 1
          curl -f https://anpr.ecu911.gob.ec/api/health || exit 1

      - name: Notify deployment success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment to production successful'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Deployment to production failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy-production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/anpr-backend -n production
          kubectl rollout undo deployment/anpr-frontend -n production
          kubectl rollout undo deployment/anpr-service -n production

      - name: Restore database backup
        run: |
          # Restore from latest backup
          kubectl exec -n production deployment/anpr-db -- psql ANPR_ECU911 < backup_latest.sql

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: 'rollback'
          text: 'Production rollback executed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}