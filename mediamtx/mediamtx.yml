# ==============================================================================
# Configuración de MediaMTX para el ECU 911 Zona 3 (Ambato)
# Cámara: Hikvision DS-2CD1123G0E-I (Acceso Vehicular 10.126.9.104)
# ==============================================================================

# Protocolos habilitados
rtsp: yes
rtmp: yes
hls: yes
webrtc: yes

# Puertos de red
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889

# Optimización de transporte WebRTC (WHEP)
webrtcLocalUDPAddress: :8189

# Configuración de rutas (paths)
paths:
  # ----------------------------------------------------------------------------
  # 1. STREAM RAW: Ingesta directa H.265+ desde la cámara Hikvision (para ANPR)
  # ----------------------------------------------------------------------------
  camara_raw:
    source: rtsp://admin:Ecu911Ambato@10.126.9.104:554/Streaming/Channels/101
    sourceProtocol: tcp
    rtspTransport: tcp
    sourceOnDemand: no
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s

  # ----------------------------------------------------------------------------
  # 2. STREAM WEB: Transcodificación H.264 para WebRTC / Frontend
  # ----------------------------------------------------------------------------
  camara_web:
    runOnInit: ffmpeg -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -rtsp_transport tcp -i rtsp://127.0.0.1:8554/camara_raw -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -level 3.1 -pix_fmt yuv420p -g 30 -keyint_min 30 -sc_threshold 0 -b:v 2000k -maxrate 2500k -bufsize 500k -an -f rtsp rtsp://127.0.0.1:8554/camara_web
    runOnInitRestart: yes

  # ----------------------------------------------------------------------------
  # 3. ALIAS 'camera' PARA RETROCOMPATIBILIDAD
  # ----------------------------------------------------------------------------
  camera:
    source: rtsp://127.0.0.1:8554/camara_raw
    sourceProtocol: tcp
    rtspTransport: tcp
    sourceOnDemand: no
