# Relay RTSP → WebRTC (WHEP). Autentica cada lectura contra http://backend:5000/api/medios/autorizar.
# La señalización WHEP (8889) se publica por el Ingress (host de video); los medios WebRTC (8189 UDP/TCP)
# necesitan un Service expuesto fuera del clúster (LoadBalancer o NodePort, según el clúster) cuya IP
# se declara en WEBRTC_HOSTS.
apiVersion: v1
kind: Service
metadata:
  name: mediamtx
  labels:
    app.kubernetes.io/name: mediamtx
spec:
  selector:
    app.kubernetes.io/name: mediamtx
  ports:
    - name: rtsp
      port: 8554
      targetPort: 8554
    - name: webrtc
      port: 8889
      targetPort: 8889
    - name: api
      port: 9997
      targetPort: 9997
---
apiVersion: v1
kind: Service
metadata:
  name: mediamtx-webrtc
  labels:
    app.kubernetes.io/name: mediamtx
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: mediamtx
  ports:
    - name: webrtc-udp
      protocol: UDP
      port: 8189
      targetPort: 8189
    - name: webrtc-tcp
      protocol: TCP
      port: 8189
      targetPort: 8189
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
  labels:
    app.kubernetes.io/name: mediamtx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mediamtx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediamtx
    spec:
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.6.0
          env:
            - name: MTX_WEBRTCADDITIONALHOSTS
              valueFrom:
                configMapKeyRef:
                  name: anpr-config
                  key: WEBRTC_HOSTS
          ports:
            - containerPort: 8554
              name: rtsp
            - containerPort: 8889
              name: webrtc
            - containerPort: 9997
              name: api
            - containerPort: 8189
              protocol: UDP
              name: webrtc-udp
            - containerPort: 8189
              protocol: TCP
              name: webrtc-tcp
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 9997
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
