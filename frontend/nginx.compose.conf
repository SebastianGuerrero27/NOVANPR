# Frontend de producción con Docker Compose (docker-compose.prod.yml): sirve la SPA y reenvía al
# backend la API, Socket.IO y la evidencia fotográfica, que en Kubernetes enruta el Ingress. Así el
# navegador usa un solo origen (VITE_API_URL vacío en la imagen). nginx.conf, sin proxy, sigue
# siendo el de la imagen para Kubernetes.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # API REST (incluida la documentación Swagger en /api/docs, si está habilitada)
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
    proxy_read_timeout 120s;
  }

  # Tiempo real (Socket.IO sobre WebSocket)
  location /socket.io/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  # Evidencia fotográfica (enlaces firmados con vencimiento; el backend valida la firma)
  location /media/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # El service worker de Web Push debe revalidarse siempre para que las actualizaciones lleguen
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Recursos con hash de Vite: caché larga e inmutable
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Rutas del cliente (React Router): todo lo demás devuelve index.html sin caché
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
